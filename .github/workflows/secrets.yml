# Quét bí mật toàn bộ lịch sử git, mọi nhánh (kể cả arena/*) — P7.3.
# Lộ một lần ⇒ coi như hỏng, phải XOAY KHOÁ (docs/PLAN.md P7.3, LEGAL_REGISTER.md §E1).
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # thứ Hai hằng tuần: bắt cả nhánh được đẩy mà không qua PR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: "Secret scan (full history, all branches)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # toàn bộ lịch sử + mọi nhánh vào refs/remotes/origin/*
      - name: Fetch every branch explicitly
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          n=$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -vc '/HEAD$')
          c=$(git rev-list --all --count)
          echo "::notice title=secret-scan::quét $n nhánh, $c commit"
          test "$n" -ge 1
      - name: Scanner self-test
        run: python3 scripts/test_scan_secrets.py
      - name: Scan tree + full history
        run: python3 scripts/scan_secrets.py --history
